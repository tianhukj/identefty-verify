<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>下发 Didit 链接控制台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #e8f8ee;
            color: #204030;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 640px;
            background: #ffffff;
            border-radius: 20px;
            padding: 36px;
            box-shadow: 0 6px 20px rgba(40, 160, 90, 0.12);
            border: 1px solid #c8eed9;
        }
        h1 {
            font-size: 26px;
            color: #1b5c38;
            margin-bottom: 10px;
        }
        .desc {
            color: #548c70;
            font-size: 15px;
            margin-bottom: 30px;
        }
        .input-block {
            margin-bottom: 24px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #307050;
            font-weight: 500;
        }
        input {
            width: 100%;
            background-color: #f2fbf6;
            border: 1px solid #b2e2cb;
            border-radius: 12px;
            padding: 15px 18px;
            color: #204030;
            font-size: 16px;
            outline: none;
            transition: 0.25s ease;
        }
        input:focus {
            border-color: #42b983;
            box-shadow: 0 0 0 4px rgba(66, 185, 131, 0.15);
        }
        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #42b983, #36a573);
            color: #ffffff;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s ease;
        }
        .btn:hover {
            background: linear-gradient(135deg, #38a874, #2d9465);
            transform: translateY(-2px);
        }
        .btn:active {
            transform: translateY(0);
        }
        .status {
            margin-top: 20px;
            padding: 16px 18px;
            border-radius: 12px;
            background-color: #f2fbf6;
            font-size: 15px;
            min-height: 52px;
            color: #204030;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>下发 Didit 链接控制台</h1>
    <p class="desc">输入 Didit 会话链接，一键推送到平板监听页面</p>

    <div class="input-block">
        <label>Didit 跳转链接</label>
        <input type="text" id="urlInput" placeholder="粘贴完整的 Didit session 链接">
    </div>

    <button class="btn" id="sendBtn">推送链接至平板</button>
    <div class="status" id="statusBox">状态：等待操作</div>
</div>

<script src="https://cdn.goeasy.io/goeasy-2.10.1.min.js"></script>
<script>
    // ========== 在这里填入你的配置，修改下面两行 ==========
    const commonKey = "BC-d4cfcb8b7010477c8b095b97d042aa12";
    const channelName = "internal‑didit‑push‑001";
    // ======================================================

    let goEasy = null;
    const statusBox = document.getElementById('statusBox');

    document.getElementById('sendBtn').onclick = function () {
        const targetUrl = document.getElementById('urlInput').value.trim();

        if (!commonKey || commonKey === "在这里填入你的GoEasy Common Key") {
            statusBox.innerText = "错误：请先在源码内填写 GoEasy Common Key";
            return;
        }
        if (!targetUrl) {
            statusBox.innerText = "状态：请输入跳转链接";
            return;
        }
        if (!targetUrl.startsWith("http")) {
            statusBox.innerText = "状态：链接必须以 http / https 开头";
            return;
        }

        if (!goEasy) {
            goEasy = new GoEasy({ appkey: commonKey });
        }

        statusBox.innerText = "状态：正在推送消息……";
        goEasy.publish({
            channel: channelName,
            message: JSON.stringify({ jumpUrl: targetUrl }),
            onSuccess: function () {
                statusBox.innerText = "✅ 推送成功，平板将会自动跳转";
            },
            onFailed: function (err) {
                statusBox.innerText = "推送失败：" + err.content;
            }
        })
    }
</script>
</body>
</html>
