<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>推送发送控制台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            background-color: #e8f8ee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .wrap {
            width: 100%;
            max-width: 600px;
        }
        .title {
            font-size: 28px;
            color: #1b5c38;
            text-align: center;
            margin-bottom: 36px;
        }
        .input-item {
            margin-bottom: 24px;
        }
        .input-item input {
            width: 100%;
            background: #f2fbf6;
            border: 1px solid #b2e2cb;
            border-radius: 14px;
            padding: 16px 20px;
            font-size: 16px;
            outline: none;
        }
        .input-item input:focus {
            border-color: #42b983;
            box-shadow: 0 0 0 4px rgba(66, 185, 131, 0.15);
        }
        .btn {
            width: 100%;
            padding: 18px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #42b983, #36a573);
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
            margin-bottom:16px;
        }
        .btn-secondary {
            background: linear-gradient(135deg, #4088bb, #307099);
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .status-text {
            margin-top: 20px;
            text-align: center;
            font-size: 16px;
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="title">推送发送控制台</div>
    <div class="input-item">
        <input id="urlInput" placeholder="输入要推送到平板的完整链接（http/https开头）">
    </div>
    <button class="btn" id="sendUrlBtn">推送链接至平板</button>
    <button class="btn btn-secondary" id="sendBackBtn">指令：让平板返回欢迎首页</button>
    <div class="status-text" id="statusBox">等待操作</div>
</div>

<script src="https://cdn.goeasy.io/goeasy-2.13.24.min.js"></script>
<script>
    // ========== 配置项，自行修改 ==========
    const commonKey = "BC-d4cfcb8b7010477c8b095b97d042aa12"; // BC‑开头
    const channelName = "terminal‑platform‑push‑001";
    const CMD_BACK_HOME = "__BACK_TO_HOME__";
    // ======================================

    let goEasy = null;
    let isConnected = false;
    const statusBox = document.getElementById("statusBox");
    const urlInput = document.getElementById("urlInput");
    const sendUrlBtn = document.getElementById("sendUrlBtn");
    const sendBackBtn = document.getElementById("sendBackBtn");

    function initGoEasy() {
        if (!commonKey || commonKey === "在这里填入你的GoEasy Common Key") {
            statusBox.innerText = "错误：请先填入 Common Key(BC‑开头)";
            return;
        }
        goEasy = GoEasy.getInstance({
            host: "hangzhou.goeasy.io",
            appkey: commonKey,
            modules: ['pubsub']
        });
        goEasy.connect({
            onSuccess: function () {
                isConnected = true;
                statusBox.innerText = "GoEasy连接成功，可以发送";
            },
            onFailed: function (err) {
                isConnected = false;
                statusBox.innerText = "连接失败：" + err.content;
            },
            onProgress: function (attempts) {
                statusBox.innerText = "正在尝试连接，第" + attempts + "次";
            }
        });
    }

    function sendMsg(text) {
        if (!isConnected) {
            statusBox.innerText = "尚未连接，请等待连接成功";
            return;
        }
        goEasy.pubsub.publish({
            channel: channelName,
            message: text,
            onSuccess: function () {
                statusBox.innerText = "✅消息发送成功";
            },
            onFailed: function (err) {
                statusBox.innerText = "发送失败：" + err.content;
            }
        })
    }

    sendUrlBtn.onclick = function () {
        const targetUrl = urlInput.value.trim();
        if (!targetUrl) {
            statusBox.innerText = "请输入链接";
            return;
        }
        if (!targetUrl.startsWith("http")) {
            statusBox.innerText = "链接必须以 http / https 开头";
            return;
        }
        sendMsg(targetUrl);
    }

    sendBackBtn.onclick = function () {
        sendMsg(CMD_BACK_HOME);
    }

    initGoEasy();
</script>
</body>
</html>
