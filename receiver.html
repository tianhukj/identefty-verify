<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平板推送监听</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #e8f8ee;
            color: #204030;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .wrap {
            max-width: 580px;
            width: 100%;
            background: #ffffff;
            border-radius: 22px;
            padding: 44px 32px;
            border: 1px solid #c8eed9;
            box-shadow: 0 6px 20px rgba(40, 160, 90, 0.12);
        }
        h2 {
            font-size: 28px;
            color: #1b5c38;
            margin-bottom: 14px;
        }
        .tip {
            color: #548c70;
            font-size: 16px;
            margin-bottom: 36px;
        }
        .state-box {
            padding: 20px;
            border-radius: 14px;
            background-color: #f2fbf6;
            font-size: 16px;
            color: #204030;
        }
    </style>
</head>
<body>
<div class="wrap">
    <h2>正在监听推送</h2>
    <p class="tip">页面需要保持前台打开，收到指令将立刻自动跳转</p>
    <div class="state-box" id="stateText">正在启动连接……</div>
</div>

<script src="https://cdn.goeasy.io/goeasy-2.10.1.min.js"></script>
<script>
    // ========== 和发送端填写完全一样的配置 ==========
    const commonKey = "BC-d4cfcb8b7010477c8b095b97d042aa12";
    const channelName = "internal‑didit‑push‑001";
    // ================================================

    let goEasy = null;
    let channelObj = null;
    const stateText = document.getElementById('stateText');

    function startListen() {
        if (!commonKey || commonKey === "在这里填入你的GoEasy Common Key") {
            stateText.innerText = "错误：请先在源码内填写 GoEasy Common Key";
            return;
        }
        if (goEasy) goEasy.disconnect();

        goEasy = new GoEasy({ appkey: commonKey });
        stateText.innerText = "正在连接 GoEasy 服务……";

        channelObj = goEasy.subscribe({
            channel: channelName,
            onMessage: function (msg) {
                try {
                    const data = JSON.parse(msg.content);
                    if (data.jumpUrl && data.jumpUrl.startsWith("http")) {
                        stateText.innerText = "收到跳转指令，即将打开：" + data.jumpUrl;
                        window.location.href = data.jumpUrl;
                    }
                } catch (e) { }
            },
            onSuccess: function () {
                stateText.innerText = "✅ 连接成功，等待推送指令";
            },
            onFailed: function (err) {
                stateText.innerText = "连接失败：" + err.content;
            }
        })
    }

    window.onload = startListen;
</script>
</body>
</html>
<script>
    let goEasy = null;
    let channelObj = null;
    const stateText = document.getElementById('stateText');

    function startListen(){
        const key = document.getElementById('goeasyKey').value.trim();
        const channel = document.getElementById('channelName').value.trim();
        if(!key || !channel){
            stateText.innerText = "请先填写 Key 和频道名称";
            return;
        }

        if(goEasy) goEasy.disconnect();

        goEasy = new GoEasy({appkey: key});
        stateText.innerText = "正在连接……";

        channelObj = goEasy.subscribe({
            channel: channel,
            onMessage: function(msg){
                try{
                    const data = JSON.parse(msg.content);
                    if(data.jumpUrl && data.jumpUrl.startsWith("http")){
                        stateText.innerText = "收到跳转指令，即将打开：" + data.jumpUrl;
                        window.location.href = data.jumpUrl;
                    }
                }catch(e){}
            },
            onSuccess:function(){
                stateText.innerText = "✅ 连接成功，等待推送";
            },
            onFailed:function(err){
                stateText.innerText = "连接失败：" + err.content;
            }
        })
    }

    document.getElementById('goeasyKey').addEventListener('change', startListen);
    document.getElementById('channelName').addEventListener('change', startListen);
</script>
</body>
</html>
