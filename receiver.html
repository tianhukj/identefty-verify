<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>终端平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #e8f8ee;
            color: #204030;
            min-height: 100vh;
        }
        .home-page {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        .logo-box {
            margin-bottom: 32px;
        }
        .logo-box img {
            max-width: 260px;
            max-height: 260px;
            object-fit: contain;
        }
        .title-text {
            font-size: 34px;
            color: #1b5c38;
            font-weight: 600;
            margin-bottom: 24px;
            text-align: center;
        }
        .conn-status {
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="home-page">
        <div class="logo-box">
            <img src="在这里替换成你的logo图片链接" alt="logo">
        </div>
        <div class="title-text">欢迎使用终端平台</div>
        <div class="conn-status" id="connectStatus">正在连接推送服务...</div>
    </div>

<script src="https://cdn.goeasy.io/goeasy-2.13.24.min.js"></script>
<script>
    // ========== 配置项，自行修改 ==========
    const commonKey = "BC-d4cfcb8b7010477c8b095b97d042aa12"; // BC‑开头
    const channelName = "terminal‑platform‑push‑001";
    const CMD_BACK_HOME = "__BACK_TO_HOME__";
    // ======================================
    const connectStatus = document.getElementById("connectStatus");

    function startConnect() {
        if (!commonKey || commonKey === "在这里填入你的GoEasy Common Key") {
            connectStatus.innerText = "错误：请先填入 Common Key(BC‑开头)";
            return;
        }
        let goEasy = GoEasy.getInstance({
            host: "hangzhou.goeasy.io",
            appkey: commonKey,
            modules: ['pubsub']
        });
        goEasy.connect({
            onSuccess: function () {
                connectStatus.innerText = "✅推送服务已就绪，等待接收指令";
                goEasy.pubsub.subscribe({
                    channel: channelName,
                    onMessage: function (msg) {
                        const content = msg.content;
                        if (content === CMD_BACK_HOME) {
                            // 收到返回首页指令，刷新当前页面回到欢迎界面
                            location.reload();
                        } else if (content.startsWith("http")) {
                            // 收到链接，当前页面直接跳转
                            location.href = content;
                        }
                    },
                    onSuccess: function () {
                        console.log("订阅频道成功");
                    },
                    onFailed: function (err) {
                        connectStatus.innerText = "订阅频道失败：" + err.content;
                    }
                })
            },
            onFailed: function (err) {
                connectStatus.innerText = "连接推送服务失败：" + err.content;
            },
            onProgress: function (attempts) {
                connectStatus.innerText = "正在尝试连接，第" + attempts + "次";
            }
        })
    }
    window.onload = startConnect;
</script>
</body>
</html>
